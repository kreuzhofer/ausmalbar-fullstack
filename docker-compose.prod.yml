services:
  web:
    build: .
    command: >
      bash -c "
        python manage.py wait_for_db &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        PYTHONPATH=/app python /app/scripts/create_admin.py &&
        python manage.py run_scheduler &
        gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120 ausmalbar.wsgi:application
      "
    volumes:
      - media_volume:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      # Database
      - DB_ENGINE=${DB_ENGINE:-postgresql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-ausmalbar}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      # Django
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DOMAIN_LANGUAGE_MAPPING=${DOMAIN_LANGUAGE_MAPPING}
      # Admin user (created on first start)
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      # Security
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-True}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-True}
      - CSRF_USE_SESSIONS=${CSRF_USE_SESSIONS:-False}
      - CSRF_COOKIE_HTTPONLY=${CSRF_COOKIE_HTTPONLY:-True}
      - CSRF_COOKIE_SAMESITE=${CSRF_COOKIE_SAMESITE:-Lax}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-Lax}
      - SESSION_COOKIE_HTTPONLY=${SESSION_COOKIE_HTTPONLY:-True}
      - SECURE_PROXY_SSL_HEADER=${SECURE_PROXY_SSL_HEADER:-HTTP_X_Forwarded_Proto,https}
      # APIs
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MIXPANEL_TOKEN=${MIXPANEL_TOKEN}
      # Imprint
      - IMPRINT_NAME=${IMPRINT_NAME}
      - IMPRINT_STREET=${IMPRINT_STREET}
      - IMPRINT_CITY=${IMPRINT_CITY}
      - IMPRINT_COUNTRY=${IMPRINT_COUNTRY:-Germany}
      - IMPRINT_EMAIL=${IMPRINT_EMAIL}
      - IMPRINT_PHONE=${IMPRINT_PHONE}
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg13
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-ausmalbar}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ausmalbar}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume:
